name: Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Ayuemin-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish preview release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.2.1-debug
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Agent Ayuemin 0.2.1 Debug" --prerelease --notes "API parser, diagnostics, menu/drawer, composer and cancellation preview. CI build only; device functionality is unverified. Debug signing may change between runs."
          fi
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
